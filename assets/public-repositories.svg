<svg xmlns="http://www.w3.org/2000/svg" width="960" height="261" viewBox="0 0 960 261" role="img" aria-labelledby="title desc">
  <title id="title">Public repository count and top languages</title>
  <desc id="desc">61 public repositories. Top languages by aggregate bytes, public + accessible private: Liquid 23.4%, TypeScript 21.5%, Python 20.9%, JavaScript 13.0%.</desc>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .language-bar {
        transform-box: fill-box;
        transform-origin: left center;
        animation: draw-bar 8s cubic-bezier(.35,.1,.25,1) var(--delay) infinite;
      }
      .speed-lines {
        animation: sweep-lines 8s ease-out infinite;
      }
      @keyframes draw-bar {
        0%, 24%, 100% { transform: scaleX(1); }
        7% { transform: scaleX(.05); }
      }
      @keyframes sweep-lines {
        0%, 24%, 100% { opacity: .42; transform: translateX(0); }
        7% { opacity: .12; transform: translateX(-12px); }
        15% { opacity: .75; transform: translateX(7px); }
      }
    }
  </style>
  <defs>
    <pattern id="halftone" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#713742"/>
    </pattern>
    <clipPath id="stat-panel">
      <path d="M4 4H330L288 257H4Z"/>
    </clipPath>
  </defs>
  <path fill="#211829" d="M4 4H956V257H4Z"/>
  <path fill="#f88169" d="M4 4H330L288 257H4Z"/>
  <path fill="url(#halftone)" clip-path="url(#stat-panel)" d="M168 0H335V261H122L168 216Z" opacity=".34"/>
  <path class="speed-lines" d="M173 111h95m-79 18h67m-103 18h93" fill="none" stroke="#713742" stroke-width="4" opacity=".42"/>
  <path d="M330 4L288 257M4 4H956V257H4Z" fill="none" stroke="#130f18" stroke-width="7" stroke-linejoin="round"/>
  <path d="M345 64H914" stroke="#8a5366" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="33" y="48" fill="#211829" font-size="23" font-weight="850" letter-spacing="1">PUBLIC</text>
    <text x="33" y="75" fill="#211829" font-size="23" font-weight="850" letter-spacing="1">REPOSITORIES</text>
    <text x="28" y="166" fill="#fbebd3" stroke="#211829" stroke-width="3" paint-order="stroke fill" font-size="90" font-weight="900" letter-spacing="-3">61</text>
    <text x="33" y="209" fill="#211829" font-size="20" font-weight="650">Excludes forks and</text>
    <text x="33" y="233" fill="#211829" font-size="20" font-weight="650">archived repositories</text>
    <text x="345" y="46" fill="#fbebd3" font-size="24" font-weight="850">Top languages</text>
    <text x="914" y="46" fill="#f3c5a9" font-size="19" text-anchor="end">Public + accessible private · by bytes</text>
  </g>
  <g fill="#fbebd3" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="600">
    <text x="345" y="96">Liquid</text>
    <rect x="552" y="82" width="273" height="13" fill="#49364b" stroke="#130f18" stroke-width="2"/>
    <rect class="language-bar" style="--delay: 0ms" x="552" y="82" width="63.8" height="13" fill="#96dfbc" stroke="#130f18" stroke-width="2"/>
    <text x="914" y="96" text-anchor="end">23.4%</text>
    <text x="345" y="135">TypeScript</text>
    <rect x="552" y="121" width="273" height="13" fill="#49364b" stroke="#130f18" stroke-width="2"/>
    <rect class="language-bar" style="--delay: 120ms" x="552" y="121" width="58.7" height="13" fill="#96dfbc" stroke="#130f18" stroke-width="2"/>
    <text x="914" y="135" text-anchor="end">21.5%</text>
    <text x="345" y="174">Python</text>
    <rect x="552" y="160" width="273" height="13" fill="#49364b" stroke="#130f18" stroke-width="2"/>
    <rect class="language-bar" style="--delay: 240ms" x="552" y="160" width="57.0" height="13" fill="#96dfbc" stroke="#130f18" stroke-width="2"/>
    <text x="914" y="174" text-anchor="end">20.9%</text>
    <text x="345" y="213">JavaScript</text>
    <rect x="552" y="199" width="273" height="13" fill="#49364b" stroke="#130f18" stroke-width="2"/>
    <rect class="language-bar" style="--delay: 360ms" x="552" y="199" width="35.5" height="13" fill="#96dfbc" stroke="#130f18" stroke-width="2"/>
    <text x="914" y="213" text-anchor="end">13.0%</text>
  </g>
</svg>
